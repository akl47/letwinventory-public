<div class="orders-table-container">
  <div class="page-header">
    <h2>
      <mat-icon>shopping_cart</mat-icon>
      Orders
    </h2>
  </div>

  @if (statusesLoaded()) {
    <app-data-table
      [data]="allOrders()"
      [columns]="columns"
      [filterSections]="filterSections()"
      [searchKeys]="searchKeys"
      [defaultSort]="{ key: 'placedDate', dir: 'desc' }"
      [defaultPageSize]="25"
      [pageSizeOptions]="[10, 25, 50, 100]"
      [rowHref]="rowHref"
      searchPlaceholder="Search by order #, vendor, status, or notes"
      (rowClick)="viewOrder($event)">

      <div dataTableToolbar>
        <span [matTooltip]="canWrite() ? '' : 'You do not have permission'">
          <button mat-stroked-button (click)="openBulkUpload()" [disabled]="!canWrite()">
            <mat-icon>upload_file</mat-icon>
            Bulk Import
          </button>
        </span>
        <span [matTooltip]="canWrite() ? '' : 'You do not have permission'">
          <button mat-flat-button color="primary" (click)="createNewOrder()" [disabled]="!canWrite()">
            <mat-icon>add</mat-icon>
            New Order
          </button>
        </span>
      </div>

      <ng-template appColumn="orderID" let-order>
        <strong>{{ order.id }}</strong>
      </ng-template>

      <ng-template appColumn="vendor" let-order>{{ order.vendor || '-' }}</ng-template>

      <ng-template appColumn="description" let-order>{{ order.description || '-' }}</ng-template>

      <ng-template appColumn="placedDate" let-order>{{ order.placedDate | date: 'mediumDate' }}</ng-template>

      <ng-template appColumn="status" let-order>
        <app-category-badge
          [label]="order.OrderStatus?.name || 'Unknown'"
          [colorHex]="order.OrderStatus?.tagColor" />
      </ng-template>

      <ng-template appColumn="itemCount" let-order>{{ calculateItemCount(order) }}</ng-template>

      <ng-template appColumn="totalPrice" let-order>${{ calculateTotalPrice(order).toFixed(2) }}</ng-template>

      <ng-template appColumn="actions" let-order>
        <button mat-icon-button (click)="viewOrder(order); $event.stopPropagation()" matTooltip="View order details">
          <mat-icon>visibility</mat-icon>
        </button>
        @if (order.link) {
          <button mat-icon-button (click)="$event.stopPropagation(); openOrderLink(order.link)" matTooltip="Open order link">
            <mat-icon>link</mat-icon>
          </button>
        }
      </ng-template>
    </app-data-table>
  }
</div>
