<div class="page-container">
  <div class="page-header">
    <h2>
      <mat-icon>build_circle</mat-icon>
      Kits
    </h2>
  </div>

  @if (isLoading()) {
    <div class="loading-container">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else {
    <app-data-table
      [data]="builds()"
      [columns]="columns"
      [filterSections]="filterSections"
      [searchKeys]="searchKeys"
      [defaultSort]="{ key: 'createdAt', dir: 'desc' }"
      searchPlaceholder="Search by part name, barcode, or category"
      (rowClick)="openBuild($event)">

      <div dataTableToolbar>
        <span [matTooltip]="canWrite() ? '' : 'You do not have permission'">
          <button mat-flat-button color="primary" (click)="openNewBuild()" [disabled]="!canWrite()">
            <mat-icon>add</mat-icon>
            New Kit
          </button>
        </span>
      </div>

      <ng-template appColumn="barcode" let-build>
        <app-barcode-tag [barcode]="build.barcode" (dataChanged)="loadBuilds()"></app-barcode-tag>
      </ng-template>

      <ng-template appColumn="partName" let-build>
        {{ build.partName | partNumber:build.partRevision }}
      </ng-template>

      <ng-template appColumn="category" let-build>
        <app-category-badge [label]="build.categoryName" [colorHex]="build.categoryColor" />
      </ng-template>

      <ng-template appColumn="status" let-build>
        @if (build.status === 'complete') {
          <span class="status-chip status-complete">Complete</span>
        } @else {
          <span class="status-chip status-partial">Partial</span>
        }
      </ng-template>

      <ng-template appColumn="progress" let-build>
        <span class="progress-text">{{ build.bomFulfilled }} / {{ build.bomTotal }}</span>
      </ng-template>

      <ng-template appColumn="createdAt" let-build>{{ build.createdAt | date:'short' }}</ng-template>
    </app-data-table>
  }
</div>
