<div class="equipment-table-container">
  <div class="page-header">
    <h2>
      <mat-icon>construction</mat-icon>
      Equipment
    </h2>
  </div>

  <app-data-table
    [data]="allEquipment()"
    [columns]="columns"
    [filterSections]="filterSections"
    [searchKeys]="searchKeys"
    [defaultSort]="{ key: 'name', dir: 'asc' }"
    searchPlaceholder="Search by name, serial number, or barcode">

    <div dataTableToolbar>
      <span [matTooltip]="canWrite() ? '' : 'You do not have permission'">
        <button mat-flat-button color="primary" (click)="openNewEquipmentDialog()" [disabled]="!canWrite()">
          <mat-icon>add</mat-icon>
          New Equipment
        </button>
      </span>
    </div>

    <ng-template appColumn="name" let-equipment>
      <strong>{{ equipment.name }}</strong>
      @if (equipment.description) {
        <div class="equipment-description">{{ equipment.description }}</div>
      }
    </ng-template>

    <ng-template appColumn="serialNumber" let-equipment>
      <span class="serial-number">{{ equipment.serialNumber || '-' }}</span>
    </ng-template>

    <ng-template appColumn="barcode" let-equipment>
      <app-barcode-tag [barcode]="equipment.Barcode?.barcode"></app-barcode-tag>
    </ng-template>

    <ng-template appColumn="commissionDate" let-equipment>{{ formatDate(equipment.commissionDate) }}</ng-template>

    <ng-template appColumn="actions" let-equipment>
      <span [matTooltip]="canWrite() ? 'Edit equipment' : 'You do not have permission'">
        <button mat-icon-button (click)="editEquipment(equipment); $event.stopPropagation()" [disabled]="!canWrite()">
          <mat-icon>edit</mat-icon>
        </button>
      </span>
    </ng-template>
  </app-data-table>
</div>
