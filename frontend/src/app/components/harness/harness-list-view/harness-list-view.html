<div class="harness-list-container">
  <div class="page-header">
    <h2>
      <mat-icon>electrical_services</mat-icon>
      Wire Harnesses
    </h2>
  </div>

  @if (isLoading()) {
    <div class="loading-state">
      <mat-spinner diameter="48"></mat-spinner>
      <p>Loading harnesses...</p>
    </div>
  } @else {
    <app-data-table
      [data]="allHarnesses()"
      [columns]="columns"
      [filterSections]="filterSections"
      [searchKeys]="searchKeys"
      [defaultSort]="{ key: 'updatedAt', dir: 'desc' }"
      [rowHref]="rowHref"
      searchPlaceholder="Search by name, part number, or description"
      (rowClick)="openHarness($event)">

      <div dataTableToolbar>
        <span [matTooltip]="canWrite() ? '' : 'You do not have permission'">
          <button mat-flat-button color="primary" (click)="createNew()" [disabled]="!canWrite()">
            <mat-icon>add</mat-icon>
            New Harness
          </button>
        </span>
      </div>

      <ng-template appColumn="name" let-harness>
        <strong>{{ harness.name }}</strong>
      </ng-template>

      <ng-template appColumn="partNumber" let-harness>
        <span class="part-number">{{ harness.partNumber || '-' }}</span>
      </ng-template>

      <ng-template appColumn="revision" let-harness>{{ harness.revision || 'A' }}</ng-template>

      <ng-template appColumn="releaseState" let-harness>
        <span class="status-chip" [class]="'status-' + (harness.releaseState || 'draft')">
          {{ harness.releaseState || 'draft' }}
        </span>
      </ng-template>

      <ng-template appColumn="description" let-harness>{{ harness.description || '-' }}</ng-template>

      <ng-template appColumn="updatedAt" let-harness>
        <span class="date">{{ formatDate(harness.updatedAt) }}</span>
      </ng-template>

      <ng-template appColumn="actions" let-harness>
        <span [matTooltip]="canWrite() ? 'Edit harness' : 'You do not have permission'">
          <button mat-icon-button (click)="openHarness(harness); $event.stopPropagation()" [disabled]="!canWrite()">
            <mat-icon>edit</mat-icon>
          </button>
        </span>
      </ng-template>
    </app-data-table>
  }
</div>
