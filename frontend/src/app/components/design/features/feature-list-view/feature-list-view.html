<div class="feature-list-container">
  <div class="page-header">
    <h2>
      <mat-icon>view_kanban</mat-icon>
      Features
    </h2>
  </div>

  @if (loading()) {
    <div class="loading"><mat-spinner diameter="32"></mat-spinner></div>
  } @else if (error()) {
    <div class="error-banner" data-test="error">{{ error() }}</div>
  } @else {
    <app-data-table
      [data]="features()"
      [columns]="columns"
      [filterSections]="filterSections()"
      [searchKeys]="searchKeys"
      [defaultSort]="{ key: 'updatedAt', dir: 'desc' }"
      [defaultPageSize]="25"
      [pageSizeOptions]="[10, 25, 50, 100]"
      searchPlaceholder="Search by name, slug, or description">

      <div dataTableToolbar>
        <a mat-flat-button color="primary" routerLink="/features/new">
          <mat-icon>add</mat-icon>
          New Feature
        </a>
      </div>

      <ng-template appColumn="name" let-f>
        <div class="name-cell">
          <a [routerLink]="['/features', f.id, 'edit']" (click)="$event.stopPropagation()">{{ f.name }}</a>
          <div class="slug">{{ f.slug }}</div>
        </div>
      </ng-template>

      <ng-template appColumn="project" let-f>{{ projectName(f.projectID) }}</ng-template>

      <ng-template appColumn="owner" let-f>{{ f.owner?.displayName || '—' }}</ng-template>

      <ng-template appColumn="reviewState" let-f>
        <app-category-badge data-test="state-badge"
          [label]="f.reviewState" [variant]="stateVariant(f.reviewState)" />
      </ng-template>

      <ng-template appColumn="requirementCount" let-f>{{ f.requirementCount || 0 }}</ng-template>

      <ng-template appColumn="branch" let-f>{{ f.branchName || '—' }}</ng-template>

      <ng-template appColumn="updatedAt" let-f>{{ f.updatedAt | date:'shortDate' }}</ng-template>
    </app-data-table>
  }
</div>
