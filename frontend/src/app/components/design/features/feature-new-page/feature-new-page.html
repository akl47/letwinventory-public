<div class="feature-new-page">
  <mat-card>
    <mat-card-header>
      <mat-card-title>New Feature</mat-card-title>
      <mat-card-subtitle>Create a draft feature record. You can fill in the rest on the edit page.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="submit()" #f="ngForm">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Name</mat-label>
          <input
            matInput
            name="name"
            data-test="input-name"
            required
            [value]="name()"
            (input)="name.set($any($event.target).value)" />
          <mat-hint>slug: {{ suggestedSlug() }}</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Project</mat-label>
          <mat-select
            data-test="select-project"
            required
            [value]="projectID()"
            (selectionChange)="projectID.set($event.value)">
            @for (p of projects(); track p.id) {
              <mat-option [value]="p.id">{{ p.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        @if (error()) {
          <div class="error-banner">{{ error() }}</div>
        }

        <div class="actions">
          <button
            mat-flat-button
            color="primary"
            type="submit"
            data-test="submit"
            [disabled]="!canSubmit()">
            Create draft
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
