<div class="page-container">
  <div class="page-header">
    <h2>Tool Catalog</h2>
  </div>

  @if (!ready()) {
    <div class="loading-container">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else {
    <app-data-table
      [data]="tools()"
      [columns]="columns"
      [filterSections]="filterSections()"
      [searchKeys]="searchKeys"
      [defaultSort]="{ key: 'diameter', dir: 'asc' }"
      [rowHref]="rowHref"
      searchPlaceholder="Part name or description"
      (rowClick)="openTool($event)">

      <div dataTableToolbar>
        <span class="unit-toggle">
          <span class="unit-label" [class.active]="toolUnit() === 'mm'">mm</span>
          <mat-slide-toggle hideIcon
            [checked]="toolUnit() === 'in'"
            (change)="onUnitToggle($event.checked ? 'in' : 'mm')"
            aria-label="Length units">
          </mat-slide-toggle>
          <span class="unit-label" [class.active]="toolUnit() === 'in'">in</span>
        </span>
      </div>

      <ng-template appColumn="partName" let-t>{{ t.part?.name }}</ng-template>

      <ng-template appColumn="description" let-t>{{ t.part?.description || '' }}</ng-template>

      <ng-template appColumn="subcategory" let-t>
        <app-category-badge [label]="t.toolSubcategory?.name || ''" subtle />
      </ng-template>

      <ng-template appColumn="categories" let-t>
        <span class="categories-cell">{{ formatCategories(t) }}</span>
      </ng-template>

      <ng-template appColumn="diameter" let-t>
        <span [title]="'Diameter (' + toolUnit() + ')'">{{ displayLength(t.diameter) }}</span>
      </ng-template>

      <ng-template appColumn="flutes" let-t>{{ t.numberOfFlutes ?? '' }}</ng-template>

      <ng-template appColumn="material" let-t>{{ t.toolMaterial || '' }}</ng-template>
    </app-data-table>
  }
</div>
