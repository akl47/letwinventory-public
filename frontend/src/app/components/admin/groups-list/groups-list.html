<div class="groups-container">
  <div class="page-header">
    <h2>
      <mat-icon>group</mat-icon>
      User Groups
    </h2>
  </div>

  @if (groups() === null) {
    <div class="loading-container">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  } @else {
    <app-data-table
      [data]="groupsList()"
      [columns]="columns"
      [searchKeys]="searchKeys"
      [defaultSort]="{ key: 'name', dir: 'asc' }"
      searchPlaceholder="Search groups"
      (rowClick)="navigateToEdit($event.id)">

      <div dataTableToolbar>
        <button mat-flat-button color="primary" (click)="navigateToNew()">
          <mat-icon>add</mat-icon>
          New Group
        </button>
      </div>

      <ng-template appColumn="name" let-group>
        <strong>{{ group.name }}</strong>
      </ng-template>

      <ng-template appColumn="description" let-group>{{ group.description || '-' }}</ng-template>

      <ng-template appColumn="memberCount" let-group>{{ group.memberCount ?? 0 }}</ng-template>

      <ng-template appColumn="actions" let-group>
        <div class="actions-cell">
          <button mat-icon-button (click)="navigateToEdit(group.id); $event.stopPropagation()">
            <mat-icon>edit</mat-icon>
          </button>
          @if (group.name !== 'Admin' && group.name !== 'Default') {
            <button mat-icon-button color="warn" (click)="deleteGroup(group.id); $event.stopPropagation()">
              <mat-icon>delete</mat-icon>
            </button>
          }
        </div>
      </ng-template>
    </app-data-table>
  }
</div>
