<div class="users-list-container">
  <div class="page-header">
    <h2>
      <mat-icon>admin_panel_settings</mat-icon>
      Users
    </h2>
  </div>

  @if (isLoading()) {
    <div class="loading-state">
      <mat-spinner diameter="48"></mat-spinner>
      <p>Loading users...</p>
    </div>
  } @else {
    <app-data-table
      [data]="users()"
      [columns]="columns"
      [filterSections]="filterSections"
      [searchKeys]="searchKeys"
      [defaultSort]="{ key: 'displayName', dir: 'asc' }"
      searchPlaceholder="Search by name or email">

      <div dataTableToolbar>
        <button mat-flat-button color="primary" (click)="openCreateDialog()">
          <mat-icon>person_add</mat-icon>
          Add User
        </button>
      </div>

      <ng-template appColumn="displayName" let-user>
        <span [class.inactive-user]="user.activeFlag === false">
          <strong>{{ user.displayName }}</strong>
          @if (user.activeFlag === false) {
            <span class="inactive-badge">Inactive</span>
          }
        </span>
      </ng-template>

      <ng-template appColumn="email" let-user>
        <span [class.inactive-user]="user.activeFlag === false">{{ user.email }}</span>
      </ng-template>

      <ng-template appColumn="groups" let-user>
        <span class="group-chips" [class.inactive-user]="user.activeFlag === false">{{ getGroupNames(user) }}</span>
      </ng-template>

      <ng-template appColumn="actions" let-user>
        <button mat-icon-button (click)="navigateToUser(user.id); $event.stopPropagation()" matTooltip="Edit permissions">
          <mat-icon>edit</mat-icon>
        </button>
      </ng-template>
    </app-data-table>
  }
</div>
