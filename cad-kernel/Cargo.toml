[package]
name = "cad-kernel"
version = "0.1.0"
edition = "2021"
description = "Server-side CAD kernel for Letwinventory (OCCT-backed)"
license = "Proprietary"
publish = false

[dependencies]
# opencascade-rs's crates.io release (0.2) is stale — the Workplane fluent
# builder + per-face mesh methods we use only exist on the main branch.
# Pull from git for now; revisit once a newer point release lands. The
# Cargo.lock generated on first build pins to a specific commit so the
# build stays reproducible until we run `cargo update`.
#
# BREP serialization is OCCT-version-sensitive — treat upstream upgrades
# as data migrations (recompute cached BRep from feature definitions).
opencascade = { git = "https://github.com/bschwind/opencascade-rs.git", branch = "main" }
# Must match the version opencascade-rs pulls in (currently 0.24). Any other
# version in our direct deps produces "expected DVec3 found DVec3" type-id
# conflicts at compile time.
glam = "0.24"

# Async runtime + Unix-domain socket server.
tokio = { version = "1.40", features = [
    "rt-multi-thread", "net", "io-util", "macros", "signal", "sync",
] }

# JSON-RPC payloads.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling + logging.
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Base64-encoding the BREP payload for JSON transport (Phase 1 will swap to
# binary WebSocket frames; for Phase 0 base64-over-JSON keeps everything in
# a single string-typed envelope).
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1  # OCCT debug builds are painfully slow without this
