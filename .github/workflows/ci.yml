name: CI

# REQ 904: tests gate PRs, pushes to master, AND release tags — previously
# only PRs ran tests, so merges and v* releases shipped unverified.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Run unit tests
        run: npx ng test --watch=false
        working-directory: frontend

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      BACKEND_PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: letwinventory_test
      DB_USERNAME: testuser
      DB_PASSWORD: testpass
      DB_DIALECT: postgres
      DB_LOGGING: "false"
      JWT_SECRET: e2e-test-secret
      FRONTEND_URL: http://localhost:4201
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: letwinventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Create database schema (migrations)
        run: npx sequelize-cli db:migrate
        working-directory: backend

      - name: Start backend
        run: nohup node index.js > /tmp/backend.log 2>&1 &
        working-directory: backend

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -so /dev/null http://localhost:3000/api/auth/user/checkToken 2>/dev/null; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
            if [ "$i" = "30" ]; then echo "Backend never became ready"; exit 1; fi
          done

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Show backend logs
        if: ${{ failure() }}
        run: cat /tmp/backend.log 2>/dev/null || true

  cad-kernel-e2e:
    name: CAD Kernel E2E (3D features)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      BACKEND_PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: letwinventory_test
      DB_USERNAME: testuser
      DB_PASSWORD: testpass
      DB_DIALECT: postgres
      DB_LOGGING: "false"
      JWT_SECRET: kernel-e2e-secret
      FRONTEND_URL: http://localhost:4201
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
      # Backend dials the kernel service on the mapped port.
      CAD_KERNEL_ADDR: 127.0.0.1:9876
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: letwinventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the kernel-source change detection can diff
          # against the PR base.
          fetch-depth: 0

      # REQ 904: PRs that change kernel source are tested against THEIR OWN
      # kernel build (registry buildcache makes this minutes, not hours) —
      # previously they ran against the stale master image.
      - name: Detect kernel source changes
        id: kernelsrc
        run: |
          CHANGED=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            if ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- cad-kernel-cpp/; then
              CHANGED=true
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.kernelsrc.outputs.changed == 'true'

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build PR kernel image
        if: steps.kernelsrc.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./cad-kernel-cpp
          load: true
          tags: letwinventory-cad-kernel:pr
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/letwinventory-cad-kernel:buildcache
            type=gha

      # REQ 904: this gate FAILS when no kernel image is available — the old
      # warn-and-skip path let PRs pass green with zero geometry verification.
      - name: Start CAD kernel
        run: |
          if [ "${{ steps.kernelsrc.outputs.changed }}" = "true" ]; then
            IMG="letwinventory-cad-kernel:pr"
          else
            IMG="ghcr.io/${{ github.repository_owner }}/letwinventory-cad-kernel:latest"
            if ! docker pull "$IMG"; then
              echo "::error::Kernel image $IMG could not be pulled — the real-geometry gate cannot run. Publish the kernel image (publish-kernel.yml) and retry."
              exit 1
            fi
          fi
          docker run -d --name cad-kernel -p 9876:9876 "$IMG"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Create database schema (migrations)
        run: npx sequelize-cli db:migrate
        working-directory: backend

      # The 3D-case generator bundles the frontend CAD sketch lib via esbuild.
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Start backend
        run: nohup node index.js > /tmp/backend.log 2>&1 &
        working-directory: backend

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -so /dev/null http://localhost:3000/api/auth/user/checkToken 2>/dev/null; then
              echo "Backend is ready"; break
            fi
            echo "Waiting for backend... ($i/30)"; sleep 2
            if [ "$i" = "30" ]; then echo "Backend never became ready"; exit 1; fi
          done

      - name: Wait for CAD kernel
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/9876) 2>/dev/null; then echo "Kernel is ready"; break; fi
            echo "Waiting for kernel... ($i/30)"; sleep 2
            if [ "$i" = "30" ]; then echo "Kernel never became ready"; exit 1; fi
          done

      - name: Verify 3D feature cases regenerate through the OCCT kernel
        run: node scripts/verify-cad-kernel.mjs
        env:
          CAD_E2E_API: http://localhost:3000

      - name: Show backend logs
        if: ${{ failure() }}
        run: cat /tmp/backend.log 2>/dev/null || true
