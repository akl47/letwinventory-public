name: Publish CAD Kernel Image

# Builds the C++/OCCT CAD kernel image and pushes it to GHCR so the per-PR
# `cad-kernel-e2e` job in ci.yml can pull it as a service container instead of
# building OCCT from source (which takes hours). Runs on master when the kernel
# sources change, or on demand. The OCCT layer is cached via the GitHub Actions
# cache so re-publishes after a source-only change are fast.

on:
  push:
    branches: [master]
    paths:
      - 'cad-kernel-cpp/**'
      - '.github/workflows/publish-kernel.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Build & push cad-kernel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cad-kernel-cpp
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/letwinventory-cad-kernel:latest
            ghcr.io/${{ github.repository_owner }}/letwinventory-cad-kernel:${{ github.sha }}
          # Registry cache (a :buildcache tag on GHCR) — the OCCT layer is
          # multi-GB and would be evicted from the 10 GB GitHub Actions cache;
          # the registry has no such cap, so re-publishes after source-only
          # changes stay fast. GHA cache kept as a secondary hit.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/letwinventory-cad-kernel:buildcache
            type=gha
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/letwinventory-cad-kernel:buildcache,mode=max
