name: Publish CAD Kernel Image

# Builds the C++/OCCT CAD kernel image and pushes it to GHCR so the per-PR
# `cad-kernel-e2e` job in ci.yml can pull it as a service container instead of
# building it. Runs on master when the kernel sources change, or on demand.
# OCCT itself comes prebuilt from the letwinventory-occt base image
# (publish-occt.yml), so this only compiles the kernel sources.

on:
  push:
    branches: [master]
    paths:
      - 'cad-kernel-cpp/**'
      - '.github/workflows/publish-kernel.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Build & push cad-kernel
    # Public repo only — the private mirror gets this file via sync-to-private.
    if: github.repository == 'akl47/letwinventory-public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Content key for the kernel sources: identical in the public and private
      # repos (unlike commit shas), so deploy-update.sh derives the same tag
      # from whatever it deploys and prod always runs the matching kernel.
      - name: Kernel source tree hash
        id: src
        run: echo "tree=$(git rev-parse HEAD:cad-kernel-cpp)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # src-<tree> is WRITE-ONCE: the kernel version is locked when its sources
      # first merge to master. A re-run (or a push that only touches this
      # workflow) never replaces the image prod already pins.
      - name: Skip if these sources are already published
        id: exists
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/letwinventory-cad-kernel:src-${{ steps.src.outputs.tree }}"
          if docker manifest inspect "$IMG" > /dev/null 2>&1; then
            echo "$IMG already published — locked, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.skip != 'true'

      - name: Build and push
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./cad-kernel-cpp
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/letwinventory-cad-kernel:latest
            ghcr.io/${{ github.repository_owner }}/letwinventory-cad-kernel:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/letwinventory-cad-kernel:src-${{ steps.src.outputs.tree }}
          # Registry cache (a :buildcache tag on GHCR) for the kernel compile
          # layers; GHA cache kept as a secondary hit.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/letwinventory-cad-kernel:buildcache
            type=gha
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/letwinventory-cad-kernel:buildcache,mode=max
