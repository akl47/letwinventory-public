name: Publish OCCT Base Image

# Builds OCCT 8.0 (hours) into its own image so kernel builds — PR CI,
# publish-kernel.yml, local compose — only compile the kernel sources.
# cad-kernel-cpp/Dockerfile pins this image by tag (OCCT_IMAGE).
#
# Runs on ANY branch when occt.Dockerfile changes (so a new OCCT version can
# be published before its branch merges), or on demand.

on:
  push:
    paths:
      - 'cad-kernel-cpp/occt.Dockerfile'
      - '.github/workflows/publish-occt.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Build & push OCCT base
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cad-kernel-cpp
          file: ./cad-kernel-cpp/occt.Dockerfile
          push: true
          # Keep in sync with OCCT_IMAGE in cad-kernel-cpp/Dockerfile.
          tags: ghcr.io/${{ github.repository_owner }}/letwinventory-occt:8.0.0
